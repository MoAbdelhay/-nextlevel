<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listings — MOUJJ</title>
<meta name="description" content="Browse properties listed with Moujj.">
<link rel="canonical" href="https://moujj.com/listings.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1628'/%3E%3Ccircle cx='32' cy='32' r='27' fill='none' stroke='%23dce6f2' stroke-width='2.5' opacity='.35'/%3E%3Cpath d='M18 34l14-14 14 14' fill='none' stroke='%23d9a44a' stroke-width='5.5' stroke-linecap='square'/%3E%3Cpath d='M10 42c4-2.6 7.5-2.6 11.5 0s7.5 2.6 11.5 0 7.5-2.6 11.5 0 7.5 2.6 11 0' fill='none' stroke='%23dce6f2' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M14 50c3.5-2.2 6.5-2.2 10 0s6.5 2.2 10 0 6.5-2.2 10 0 6.5 2.2 10 0' fill='none' stroke='%23dce6f2' stroke-width='3.5' stroke-linecap='round' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="nav.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0a1628; --bg2:#0d1b30; --ink:#dce6f2; --dim:#8fa3bd; --faint:#5b6e88;
  --line:rgba(220,230,242,.13); --accent:#dce6f2;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--mono);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--dim);outline-offset:3px}
.shell{max-width:72rem;margin:0 auto}


main{padding:calc(3.5rem + 4.6rem) 1.4rem 6rem}
.kicker{display:flex;align-items:center;gap:1rem;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--faint);margin-bottom:2rem}
.kicker::after{content:'';flex:1;height:1px;background:var(--line)}
h1{font-size:1.5rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-bottom:.4rem}
.lead{font-size:.8rem;color:var(--dim);margin-bottom:2rem}
.lead a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent)}

.lbar{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;margin-bottom:1.4rem}
.lbar input,.lbar select{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:.8rem;padding:.6rem .8rem;border-radius:0}
.lbar input{flex:1 1 220px;min-width:0}
.lbar input:focus,.lbar select:focus{outline:none;border-color:var(--dim)}
.lbar select{cursor:pointer}
.lcount{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.lbar input.num{flex:0 1 9rem}
.lbar2{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:-.4rem 0 1.2rem}
.viewtabs{display:flex;border:1px solid var(--line)}
.viewtabs button{background:none;border:0;color:var(--dim);font-family:inherit;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;padding:.45rem .9rem;cursor:pointer}
.viewtabs button[aria-selected=true]{background:var(--ink);color:#0a1628}
#lmap{height:min(70vh,560px);border:1px solid var(--line);background:#13243d}
.leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.85) contrast(.9) saturate(.6)}
.mapnote{font-size:.68rem;color:var(--faint);margin-top:.6rem}
.leaflet-popup-content{font-family:var(--mono);font-size:.74rem;margin:.7rem .9rem}
.leaflet-popup-content a{color:#0a1628;font-weight:600}
.card{text-decoration:none;color:inherit;transition:border-color .25s}
.card:hover{border-color:rgba(220,230,242,.45)}
.facts{font-size:.66rem;color:var(--dim);margin-top:.35rem;letter-spacing:.03em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.card{background:var(--bg2);border:1px solid var(--line);padding:0 0 1.1rem;display:flex;flex-direction:column}
.thumb{position:relative;height:170px;background:#13243d;display:flex;align-items:center;justify-content:center;
  color:var(--faint);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.badge{position:absolute;top:.5rem;left:.5rem;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;padding:.22rem .5rem;background:var(--accent);color:#0a1628;font-weight:600}
.badge.rent{background:rgba(10,22,40,.75);color:var(--ink);border:1px solid rgba(220,230,242,.55)}
.pcount{position:absolute;bottom:.5rem;right:.5rem;background:rgba(10,22,40,.85);color:var(--ink);font-size:.58rem;letter-spacing:.12em;padding:.2rem .45rem}
.in{padding:.9rem 1.1rem 0}
.ttl{font-size:.82rem;letter-spacing:.04em;font-weight:500}
.loc{font-size:.66rem;color:var(--faint);letter-spacing:.08em;margin-top:.2rem}
.prc{font-size:.78rem;color:var(--accent);margin-top:.45rem;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.riyal{display:inline-block;height:.82em;width:.86em;vertical-align:-.04em;fill:currentColor;margin-inline-end:.3em}
.price small{color:var(--dim);font-size:.82em;margin-inline-start:.1em}
.enq{display:inline-block;margin-top:.8rem;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--accent);padding-bottom:.1rem}
.enq:hover{color:var(--accent)}
.empty{font-size:.76rem;color:var(--faint);letter-spacing:.06em;padding:1.2rem 0}

footer{border-top:1px solid var(--line);padding:2rem 1.4rem;font-size:.66rem;color:var(--faint);letter-spacing:.06em}
footer a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink)}

html[lang=ar] body{font-family:'IBM Plex Sans Arabic',var(--mono)}
html[lang=ar] .kicker,html[lang=ar] h1,html[lang=ar] .lcount,html[lang=ar] .enq{letter-spacing:0}
html[lang=ar] .pcount{right:auto;left:.5rem}
html[lang=ar] .badge{left:auto;right:.5rem;letter-spacing:0}
html[lang=ar] .ttl,html[lang=ar] .loc{text-align:right}
html[lang=ar] .viewtabs button{letter-spacing:0;font-family:'IBM Plex Sans Arabic',var(--mono)}
html[lang=ar] .lbar input,html[lang=ar] .lbar select{font-family:'IBM Plex Sans Arabic',var(--mono)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="riyal" viewBox="40 0 1150 1270"><path d="M750,1119 C730,1163,716,1211,711,1262 C711,1262,1136,1172,1136,1172 C1156,1127,1169,1079,1174,1028 C1174,1028,750,1119,750,1119Z M1136,901 C1136,901,1136,901,1136,901 C1156,857,1169,809,1174,758 C1174,758,843,828,843,828 C843,828,843,693,843,693 C843,693,1136,631,1136,631 C1156,587,1169,538,1174,488 C1174,488,843,558,843,558 C843,558,843,72,843,72 C793,100,748,138,711,183 C711,183,711,586,711,586 C711,586,579,614,579,614 C579,614,579,6,579,6 C528,34,483,72,447,117 C447,117,447,642,447,642 C447,642,151,705,151,705 C131,750,117,798,112,849 C112,849,447,777,447,777 C447,777,447,948,447,948 C447,948,88,1024,88,1024 C68,1068,55,1117,50,1167 C50,1167,425,1088,425,1088 C456,1081,482,1063,499,1038 C499,1038,568,936,568,936 C568,936,568,936,568,936 C575,926,579,913,579,899 C579,899,579,749,579,749 C579,749,711,721,711,721 C711,721,711,992,711,992 C711,992,1136,901,1136,901Z"/></symbol>

    <path d="M14 50c3.5-2.2 6.5-2.2 10 0s6.5 2.2 10 0 6.5-2.2 10 0 6.5 2.2 10 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </symbol>
</svg>

<script src="nav.js"></script>

<main>
  <div class="shell">
    <div class="kicker" data-t="kicker">Listings</div>
    <h1 data-t="h1">Browse listings</h1>
    <p class="lead" data-t="lead">Properties submitted to the studio. Have one to add? <a href="./#submit">Submit a listing →</a></p>

    <div class="lbar">
      <input type="search" id="lsearch" aria-label="Search listings">
      <select id="lpurpose" aria-label="Sale or rent">
        <option value="all">Sale &amp; rent</option>
        <option value="sale">For sale</option>
        <option value="rent">For rent</option>
      </select>
      <select id="ltype" aria-label="Property type"><option value="">Any type</option></select>
      <select id="lbeds" aria-label="Bedrooms">
        <option value="">Any beds</option><option value="1">1+</option><option value="2">2+</option>
        <option value="3">3+</option><option value="4">4+</option><option value="5">5+</option>
      </select>
      <input type="number" id="lmin" class="num" min="0" step="1000" inputmode="numeric" aria-label="Minimum price">
      <input type="number" id="lmax" class="num" min="0" step="1000" inputmode="numeric" aria-label="Maximum price">
      <select id="lsort" aria-label="Sort listings">
        <option value="new">Newest first</option>
        <option value="low">Price: low to high</option>
        <option value="high">Price: high to low</option>
      </select>
    </div>
    <div class="lbar2">
      <span class="lcount" id="lcount"></span>
      <div class="viewtabs" role="tablist">
        <button type="button" id="vgrid" role="tab" aria-selected="true">Grid</button>
        <button type="button" id="vmap" role="tab" aria-selected="false">Map</button>
      </div>
    </div>
    <div id="mapview" hidden><div id="lmap"></div><p class="mapnote" id="mapnote"></p></div>
    <div class="grid" id="grid" hidden></div>
    <div class="empty" id="empty">Loading…</div>
  </div>
</main>

<footer>
  <div class="shell">Powered by <a href="https://takween-studio.com" target="_blank" rel="noopener">Takween Studio</a> · <a href="mailto:info@takween-studio.com">info@takween-studio.com</a></div>
</footer>

<script src="mouj.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script>
const TXT = {
  en: {
    brand:'MOUJJ', title:'Listings — MOUJJ', back:'← Home', kicker:'Listings', h1:'Browse listings',
    lead:'Properties submitted to the studio. Have one to add? <a href="./#submit">Submit a listing →</a>',
    search:'Search by district, city or title', purposeOpts:['Sale & rent','For sale','For rent'],
    anyType:'Any type', anyBeds:'Any beds', min:'Min price', max:'Max price',
    sort:['Newest first','Price: low to high','Price: high to low'], grid:'Grid', map:'Map',
    count: n => n + (n === 1 ? ' listing' : ' listings'),
    photos: n => n + ' photos', noPhoto:'No photo', view:'View →',
    noPin: n => n === 1 ? '1 matching listing has no map pin and is only in the grid.' : n + ' matching listings have no map pin and are only in the grid.',
    empty:'No listings yet — be the first to submit one.', noMatch:'No listings match your filters.',
    offline:'Listings are unavailable right now — the studio server is not answering.',
    loading:'Loading…',
  },
  ar: {
    brand:'موج', title:'العقارات — موج', back:'الرئيسية →', kicker:'العقارات', h1:'تصفّح العقارات',
    lead:'العقارات المقدَّمة إلى الاستوديو. لديك عقار؟ <a href="./#submit">قدّم عقارك ←</a>',
    search:'ابحث بالحي أو المدينة أو العنوان', purposeOpts:['بيع وإيجار','للبيع','للإيجار'],
    anyType:'كل الأنواع', anyBeds:'كل الغرف', min:'أقل سعر', max:'أعلى سعر',
    sort:['الأحدث أولًا','السعر: من الأقل','السعر: من الأعلى'], grid:'شبكة', map:'خريطة',
    count: n => n + ' عقار',
    photos: n => n + ' صور', noPhoto:'بلا صورة', view:'عرض ←',
    noPin: n => n + ' من العقارات المطابقة بلا موقع على الخريطة وتظهر في الشبكة فقط.',
    empty:'لا توجد عقارات بعد — كن أول من يضيف عقارًا.', noMatch:'لا توجد عقارات مطابقة.',
    offline:'العقارات غير متاحة حاليًا — خادم الاستوديو لا يستجيب.',
    loading:'جارٍ التحميل…',
  },
};
let LANG = 'en';
try { if (localStorage.getItem('nl-lang') === 'ar') LANG = 'ar'; } catch {}

const $ = id => document.getElementById(id);
const grid = $('grid'), empty = $('empty'), lcount = $('lcount');
const lsearch = $('lsearch'), lpurpose = $('lpurpose'), ltype = $('ltype'), lbeds = $('lbeds'), lmin = $('lmin'), lmax = $('lmax'), lsort = $('lsort');
let ALL = null, FAILED = false, VIEW = 'grid', map = null, layer = null;

for (const k of Object.keys(Moujj.TYPES)) { const o = document.createElement('option'); o.value = k; ltype.append(o); }

function showEmpty(msg){ grid.hidden = true; $('mapview').hidden = true; empty.hidden = false; empty.textContent = msg; }

function filtered(){
  const q = lsearch.value.trim().toLowerCase();
  const want = lpurpose.value, type = ltype.value, beds = Number(lbeds.value) || 0;
  const min = Number(lmin.value) || 0, max = Number(lmax.value) || Infinity;
  let list = ALL.filter(l =>
    (want === 'all' || (l.purpose || 'sale') === want) &&
    (!type || l.type === type) &&
    (!beds || (l.beds != null && l.beds >= beds)) &&
    l.price >= min && l.price <= max &&
    (!q || [l.title, l.district, l.city, l.address].join(' ').toLowerCase().includes(q)));
  if (lsort.value === 'low') list = [...list].sort((a, b) => a.price - b.price);
  else if (lsort.value === 'high') list = [...list].sort((a, b) => b.price - a.price);
  return list;
}

function card(l){
  const T = TXT[LANG], W = Moujj.WORDS[LANG], rent = l.purpose === 'rent';
  const a = document.createElement('a'); a.className = 'card'; a.href = Moujj.listingUrl(l);
  const thumb = document.createElement('div'); thumb.className = 'thumb';
  if (l.photos && l.photos.length){
    const img = document.createElement('img'); img.src = l.photos[0].url; img.alt = l.title; img.loading = 'lazy'; thumb.append(img);
    if (l.photos.length > 1){ const n = document.createElement('span'); n.className = 'pcount'; n.textContent = T.photos(l.photos.length); thumb.append(n); }
  } else thumb.textContent = T.noPhoto;
  const badge = document.createElement('span'); badge.className = 'badge' + (rent ? ' rent' : ''); badge.textContent = rent ? W.rent : W.sale; thumb.append(badge);
  const inner = document.createElement('div'); inner.className = 'in';
  const ttl = document.createElement('div'); ttl.className = 'ttl'; ttl.textContent = l.title; ttl.dir = 'auto';
  const loc = document.createElement('div'); loc.className = 'loc'; loc.textContent = Moujj.place(l); loc.dir = 'auto';
  inner.append(ttl, loc);
  const f = Moujj.facts(l, LANG);
  if (f.length){ const fx = document.createElement('div'); fx.className = 'facts'; fx.textContent = f.join(' · '); inner.append(fx); }
  const prc = document.createElement('div'); prc.className = 'prc'; prc.append(Moujj.priceEl(l.price, rent ? W.perYear : ''));
  const v = document.createElement('span'); v.className = 'enq'; v.textContent = T.view;
  inner.append(prc, v);
  a.append(thumb, inner);
  return a;
}

function render(){
  const T = TXT[LANG];
  grid.innerHTML = '';
  if (FAILED) { lcount.textContent = ''; return showEmpty(T.offline); }
  if (!ALL) return showEmpty(T.loading);
  if (!ALL.length) { lcount.textContent = ''; return showEmpty(T.empty); }
  const list = filtered();
  lcount.textContent = T.count(list.length);
  if (!list.length) return showEmpty(T.noMatch);
  empty.hidden = true;
  if (VIEW === 'grid'){
    $('mapview').hidden = true; grid.hidden = false;
    for (const l of list) grid.append(card(l));
  } else {
    grid.hidden = true; $('mapview').hidden = false;
    drawMap(list);
  }
}

function drawMap(list){
  if (!window.L) return setTimeout(() => drawMap(list), 150);
  const T = TXT[LANG], W = Moujj.WORDS[LANG];
  if (!map){
    map = window.L.map('lmap', { scrollWheelZoom: true }).setView([21.55, 39.17], 11);   /* Jeddah */
    window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 0);
  if (layer) layer.remove();
  layer = window.L.layerGroup().addTo(map);
  const pinned = list.filter(l => l.lat != null && l.lng != null);
  for (const l of pinned){
    const rent = l.purpose === 'rent';
    const box = document.createElement('div');
    const b = document.createElement('b'); b.textContent = l.title; b.dir = 'auto'; box.append(b, document.createElement('br'));
    box.append(Moujj.priceEl(l.price, rent ? W.perYear : ''), document.createElement('br'));
    const a = document.createElement('a'); a.href = Moujj.listingUrl(l); a.textContent = T.view; box.append(a);
    window.L.circleMarker([l.lat, l.lng], { radius: 9, color: '#dce6f2', weight: 2, fillColor: '#d9a44a', fillOpacity: 1 }).bindPopup(box).addTo(layer);
  }
  if (pinned.length) map.fitBounds(window.L.latLngBounds(pinned.map(l => [l.lat, l.lng])).pad(0.3), { maxZoom: 15 });
  const missing = list.length - pinned.length;
  $('mapnote').textContent = missing ? T.noPin(missing) : '';
}

function setView(v){
  VIEW = v;
  $('vgrid').setAttribute('aria-selected', v === 'grid');
  $('vmap').setAttribute('aria-selected', v === 'map');
  render();
}

function applyLang(lang){
  LANG = lang;
  try { localStorage.setItem('nl-lang', lang); } catch {}
  const T = TXT[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = T.title;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T[el.dataset.t]; });
  lsearch.placeholder = T.search; lmin.placeholder = T.min; lmax.placeholder = T.max;
  [...lsort.options].forEach((o, i) => { o.textContent = T.sort[i]; });
  [...lpurpose.options].forEach((o, i) => { o.textContent = T.purposeOpts[i]; });
  [...ltype.options].forEach(o => { o.textContent = o.value ? Moujj.typeLabel(o.value, lang) : T.anyType; });
  lbeds.options[0].textContent = T.anyBeds;
  $('vgrid').textContent = T.grid; $('vmap').textContent = T.map;
  $('langtoggle').textContent = lang === 'ar' ? 'English' : 'عربي';
  render();
}

for (const e of [lsearch, lmin, lmax]) e.addEventListener('input', render);
for (const e of [lsort, lpurpose, ltype, lbeds]) e.addEventListener('change', render);
$('vgrid').addEventListener('click', () => setView('grid'));
$('vmap').addEventListener('click', () => setView('map'));
$('langtoggle').addEventListener('click', () => applyLang(LANG === 'ar' ? 'en' : 'ar'));
const qs = new URLSearchParams(location.search);
if (qs.get('for') === 'sale' || qs.get('for') === 'rent') lpurpose.value = qs.get('for');
applyLang(LANG);

Moujj.fetchListings()
  .then(list => { ALL = list; render(); })
  .catch(() => { FAILED = true; render(); });
</script>
</body>
</html>
